name: Publish qemu-virgl (venus) bottles

on:
  workflow_dispatch:   # bottles are cut manually; push only runs tests.yml

permissions:
  contents: write   # create a release on workflow_dispatch

jobs:
  bottle:
    runs-on: macos-26   # Apple Silicon only
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
      HOMEBREW_NO_ANALYTICS: 1

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up tap
        run: brew tap s3rj1k/qemu-virgl "file://${{ github.workspace }}"

      - name: Cache Homebrew downloads
        uses: actions/cache@v5
        with:
          path: ~/Library/Caches/Homebrew
          key: brew-downloads-${{ hashFiles('Formula/**') }}
          restore-keys: brew-downloads-

      - name: Build venus stack (bottle), then bottle each formula
        id: bottle
        run: |
          set -eux
          tag="bottles-$(date +%Y%m%d%H%M%S)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          root_url="https://github.com/${{ github.repository }}/releases/download/$tag"

          # Build the full chain from source as bottles (deps first). No `|| true`:
          # a real failure must fail the job. keg_only removes the old libepoxy
          # symlink conflict, so no `brew link --overwrite --force` is needed.
          for f in libangle libepoxy-angle molten-vk-venus virglrenderer qemu-virgl; do
            brew install --build-bottle --formula "s3rj1k/qemu-virgl/$f"
          done

          # Bottle each, hosting at the release we will create below. Modern
          # `brew bottle` names files correctly (no `--`->`-` rename hack).
          mkdir -p "$GITHUB_WORKSPACE/bottles"
          cd "$GITHUB_WORKSPACE/bottles"
          for f in libangle libepoxy-angle molten-vk-venus virglrenderer qemu-virgl; do
            brew bottle --json --no-rebuild --root-url "$root_url" "s3rj1k/qemu-virgl/$f"
          done
          ls -lh

      - name: Upload bottles as artifacts
        uses: actions/upload-artifact@v7
        with:
          name: bottles
          path: bottles/

      - name: Create release with bottles
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          gh release create "${{ steps.bottle.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --title "venus bottles ${{ steps.bottle.outputs.tag }}" \
            --notes "Apple Silicon (arm64) venus bottles. Merge into the formulae with: brew bottle --merge --write bottles/*.json" \
            bottles/*.bottle.tar.gz bottles/*.bottle.json

      - name: Upload Homebrew logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: brew-logs
          path: |
            ~/Library/Logs/Homebrew/**/*.log
